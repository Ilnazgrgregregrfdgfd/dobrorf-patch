version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build: 
      context: ./dobrorf-patch
      dockerfile: Dockerfile
    environment:
      - CHOKIDAR_USEPOLLING=true
      - PORT=3001
    volumes:
      - ./dobrorf-patch:/app
      - /app/node_modules
    expose:
      - "3001"

  backend:
    build: 
      context: ./dobrorf-back
      dockerfile: Dockerfile
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://mongo:27017/dobrorf
    expose:
      - "5001"
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"

volumes:
  mongo_data:
